name: Sphinx panelcheck demo Pages

"on":
  push:
    branches: [main]
    paths:
      - "blog/sphinx-panelcheck-demo/**"
      - ".github/workflows/sphinx-panelcheck-demo-pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "blog/sphinx-panelcheck-demo/**"
      - ".github/workflows/sphinx-panelcheck-demo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: blog/sphinx-panelcheck-demo/requirements-lock.txt

      - name: Install dependencies
        working-directory: blog/sphinx-panelcheck-demo
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation -e .

      - name: Verify code and docs
        working-directory: blog/sphinx-panelcheck-demo
        run: python tools/verify.py --stage ci

      - name: Stage nested Pages site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p _site/blog/sphinx-panelcheck-demo
          rsync -a --exclude='.doctrees/' blog/sphinx-panelcheck-demo/docs/_build/ci/html/ _site/blog/sphinx-panelcheck-demo/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
